    TripExpense:
      type: object
      required: [id, tripId, paidByUserId, amount, currency, description, category, date, createdAt, splits]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        paidByUserId:
          type: integer
        payerName:
          type: string
        amount:
          type: string
        currency:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [travel, activity, restaurant, car_rental, accommodation, other]
        date:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        splits:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseSplit"

    ExpenseInput:
      type: object
      required: [paidByUserId, amount, description, date]
      properties:
        paidByUserId:
          type: integer
        amount:
          type: string
        currency:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [travel, activity, restaurant, car_rental, accommodation, other]
        date:
          type: string
        notes:
          type: string

    ExpenseUpdate:
      type: object
      properties:
        paidByUserId:
          type: integer
        amount:
          type: string
        currency:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [travel, activity, restaurant, car_rental, accommodation, other]
        date:
          type: string
        notes:
          type: string

    ExpenseBalanceEntry:
      type: object
      required: [userId, name, totalPaid, totalOwed, net]
      properties:
        userId:
          type: integer
        name:
          type: string
        totalPaid:
          type: number
        totalOwed:
          type: number
        net:
          type: number
        departed:
          type: boolean
          description: True when this person has left the trip but was the payer of one or more expenses

    ExpenseSettlement:
      type: object
      required: [fromUserId, fromName, toUserId, toName, amount]
      properties:
        fromUserId:
          type: integer
        fromName:
          type: string
        toUserId:
          type: integer
        toName:
          type: string
        amount:
          type: number

    ExpenseBalanceSummary:
      type: object
      required: [balances, settlements, totalSpent, currency]
      properties:
        balances:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseBalanceEntry"
        settlements:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseSettlement"
        totalSpent:
          type: number
        currency:
          type: string
