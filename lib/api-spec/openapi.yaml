components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [id, username, name, role]
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, traveler]
        email:
          type: ["string", "null"]

    User:
      type: object
      required: [id, username, name, role]
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, traveler]
        email:
          type: ["string", "null"]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [username, name, password]
      properties:
        username:
          type: string
        name:
          type: string
        password:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, traveler]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string

    ChangePasswordInput:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string

    Trip:
      type: object
      required: [id, title, destination, startDate, endDate, status]
      properties:
        id:
          type: integer
        title:
          type: string
        destination:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        description:
          type: ["string", "null"]
        coverImage:
          type: ["string", "null"]
        status:
          type: string
          enum: [planning, confirmed, active, completed]
        adminNotes:
          type: ["string", "null"]
        createdAt:
          type: string

    TripInput:
      type: object
      required: [title, destination, startDate, endDate]
