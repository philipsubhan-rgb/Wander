          in: path
          required: true
          schema:
            type: integer
        - name: accommodationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /trips/{tripId}/activities:
    get:
      operationId: listActivities
      tags: [activities]
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of activities
