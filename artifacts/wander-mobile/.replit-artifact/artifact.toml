kind = "mobile"
previewPath = "/wander-mobile/"
title = "Wander Mobile"
version = "1.0.0"
id = "artifacts/wander-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/wander-mobile/" ]
localPort = 18105

[services.development]
run = "pnpm --filter @workspace/wander-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wander-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/wander-mobile", "run", "serve" ]

[services.env]
PORT = "18105"
BASE_PATH = "/wander-mobile/"
